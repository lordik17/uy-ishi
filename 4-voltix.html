<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voltix — elektr skuter</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--m:#ff2bd6;--c:#18f0ff;color-scheme:dark}*{box-sizing:border-box;margin:0}
body{background:linear-gradient(#12002b,#06000f);color:#fff;font:400 16px/1.6 Unbounded,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
nav{display:flex;justify-content:space-between;padding:22px 5vw;color:var(--c);font-weight:800}
.hero{text-align:center;padding:10vh 5vw 4vh;position:relative}
.sun{width:min(320px,70vw);aspect-ratio:1;margin:0 auto -90px;border-radius:50%;background:linear-gradient(#ffe45e,var(--m));-webkit-mask:repeating-linear-gradient(#000 0 14px,transparent 14px 20px);mask:repeating-linear-gradient(#000 0 14px,transparent 14px 20px);mask-size:100% 100%}
h1{position:relative;font-weight:800;font-size:clamp(44px,12vw,150px);line-height:1;text-shadow:0 0 12px var(--m),0 0 40px var(--m)}
.hero p{position:relative;color:#d9c8ff;margin:14px 0 30px}
.b{position:relative;display:inline-block;color:#06000f;background:var(--c);padding:16px 34px;border-radius:4px;font-weight:800;text-decoration:none;box-shadow:0 0 24px var(--c);transition:.2s}.b:hover{box-shadow:0 0 50px var(--c)}
.floor{height:240px;margin-top:5vh;background:repeating-linear-gradient(90deg,var(--m) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,var(--m) 0 2px,transparent 2px 40px);transform:perspective(300px) rotateX(55deg);transform-origin:top;opacity:.5;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:0 5vw 8vh;text-align:center}
.sp div{border:1px solid var(--c);border-radius:6px;padding:20px;box-shadow:inset 0 0 20px #18f0ff22}.sp b{display:block;font-size:30px;color:var(--c)}
</style></head><body><nav><span>VOLTIX</span><span>◄ 2027</span></nav>
<section class="hero"><div class="sun"></div><h1>Kelajak<br>harakatda.</h1><p>120 km masofa. 0 gramm tutun. Cheksiz hayajon.</p><a class="b" href="#s">Oldindan buyurtma</a></section>
<div class="floor"></div>
<section class="sp" id="s"><div><b>120</b>km zaxira</div><div><b>65</b>km/soat</div><div><b>3 s</b>tezlanish</div><div><b>2 soat</b>to‘lish vaqti</div></section>
</body></html>
