<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nur — qo‘l ishi kulolchilik</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#DDE6E0;--ink:#1D2B26;--lil:#B9A7D6;--deep:#2F4A40;color-scheme:light}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 17px/1.7 Jost,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;padding:28px 6vw;font-size:15px}header a{color:inherit;margin-left:24px;text-decoration:none}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:4vw;padding:4vh 6vw 10vh;align-items:end}
h1{font:400 clamp(54px,10vw,150px)/.88 'Cormorant Garamond',Georgia,serif;letter-spacing:-.03em}h1 i{margin-left:1.2em}
.vases{display:flex;align-items:flex-end;gap:14px;height:360px}.vases div{flex:1}
.v1{height:90%;background:var(--deep);border-radius:50% 50% 12px 12px/30% 30% 12px 12px}
.v2{height:60%;background:var(--lil);border-radius:50%/40% 40% 12px 12px;border-radius:999px 999px 12px 12px}
.v3{height:75%;background:#fff;border-radius:40% 40% 10px 10px/20% 20% 10px 10px}
.row{display:grid;grid-template-columns:1fr 2fr;gap:4vw;padding:8vh 6vw;border-top:1px solid #1d2b2633}
h2{font:italic 400 44px/1.1 'Cormorant Garamond',Georgia,serif}.row p{max-width:60ch;margin-bottom:18px}
a.l{color:var(--ink);border-bottom:1px solid;text-decoration:none;padding-bottom:2px}
@media(max-width:720px){.hero,.row{grid-template-columns:1fr}h1 i{margin:0}}
</style></head><body>
<header><b>Nur ustaxonasi</b><nav><a href="#a">Kolleksiya</a><a href="#a">Ustaxona</a></nav></header>
<section class="hero"><h1>Sekin<br><i>yaratilgan</i><br>idishlar.</h1><div class="vases"><div class="v1"></div><div class="v2"></div><div class="v3"></div></div></section>
<section class="row" id="a"><h2>Har biri yagona</h2><div><p>Rishton loyidan qo‘lda shakllantirilib, ikki marta pishiriladi. Ikkita bir xil piyola yo‘q — bu nuqson emas, ularning xarakteri.</p><a class="l" href="#a">Kolleksiyani ko‘rish</a></div></section>
</body></html>
