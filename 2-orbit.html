<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orbit — moliyaviy ilova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box;margin:0}
body{font:300 17px/1.6 Sora,system-ui,sans-serif;color:#e9ecff;background:#070914;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.o{position:fixed;border-radius:50%;filter:blur(90px);z-index:-1}.o1{width:420px;height:420px;background:#6a4bff;top:-100px;left:-80px}.o2{width:380px;height:380px;background:#00d4ff;opacity:.5;right:-80px;top:30vh}

.card{background:linear-gradient(135deg,#6a4bff,#00b8ff);border-radius:20px;padding:24px;height:190px;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-4deg);box-shadow:0 30px 60px #6a4bff55;max-width:340px}
.card b{font-size:22px;letter-spacing:.12em}

.s{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:4vh 6vw 10vh}.s h2{font-size:40px;font-weight:600}
